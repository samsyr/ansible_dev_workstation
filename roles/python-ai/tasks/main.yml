---
- name: Install Python build dependencies
  ansible.builtin.apt:
    name:
      - make
      - build-essential
      - libssl-dev
      - zlib1g-dev
      - libbz2-dev
      - libreadline-dev
      - libsqlite3-dev
      - llvm
      - libncursesw5-dev
      - xz-utils
      - tk-dev
      - libxml2-dev
      - libxmlsec1-dev
      - libffi-dev
      - liblzma-dev
    state: present
    install_recommends: false

- name: Install pyenv
  become: true
  become_user: "{{ dev_user }}"
  ansible.builtin.shell: |
    curl https://pyenv.run | bash
  args:
    creates: "{{ dev_home }}/.pyenv"

- name: Enable pyenv in bash
  ansible.builtin.copy:
    dest: "{{ dev_home }}/.bashrc.d/pyenv.sh"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0644"
    content: |
      # pyenv
      export PYENV_ROOT="$HOME/.pyenv"
      export PATH="$PYENV_ROOT/bin:$PATH"

      if command -v pyenv >/dev/null 2>&1; then
        eval "$(pyenv init - bash)"
      fi

- name: Install uv
  become: true
  become_user: "{{ dev_user }}"
  ansible.builtin.shell: |
    curl -LsSf https://astral.sh/uv/install.sh | sh
  args:
    creates: "{{ dev_home }}/.local/bin/uv"

- name: Ensure Python {{ python_version }} is installed with pyenv
  become: true
  become_user: "{{ dev_user }}"
  ansible.builtin.shell: |
    export PYENV_ROOT="{{ dev_home }}/.pyenv"
    export PATH="$PYENV_ROOT/bin:$PATH"
    eval "$(pyenv init - bash)"
    pyenv install -s "{{ python_version }}"
  args:
    executable: /bin/bash
    creates: "{{ dev_home }}/.pyenv/versions/{{ python_version }}"

- name: Create AI workspace directory
  ansible.builtin.file:
    path: "{{ dev_home }}/dev/ai-sandbox"
    state: directory
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0755"

- name: Set local Python version for AI workspace
  become: true
  become_user: "{{ dev_user }}"
  ansible.builtin.copy:
    dest: "{{ dev_home }}/dev/ai-sandbox/.python-version"
    mode: "0644"
    content: "{{ python_version }}\n"

- name: Create AI virtual environment
  become: true
  become_user: "{{ dev_user }}"
  ansible.builtin.shell: |
    export PYENV_ROOT="{{ dev_home }}/.pyenv"
    export PATH="$PYENV_ROOT/bin:{{ dev_home }}/.local/bin:$PATH"
    eval "$(pyenv init - bash)"
    cd "{{ dev_home }}/dev/ai-sandbox"
    uv venv .venv --python "{{ python_version }}"
  args:
    executable: /bin/bash
    creates: "{{ dev_home }}/dev/ai-sandbox/.venv"

- name: Install AI Python packages into project venv
  become: true
  become_user: "{{ dev_user }}"
  ansible.builtin.shell: |
    export PYENV_ROOT="{{ dev_home }}/.pyenv"
    export PATH="$PYENV_ROOT/bin:{{ dev_home }}/.local/bin:$PATH"
    eval "$(pyenv init - bash)"
    cd "{{ dev_home }}/dev/ai-sandbox"

    uv pip install \
      torch torchvision torchaudio \
      --index-url https://download.pytorch.org/whl/cu128

    uv pip install \
      ultralytics \
      scikit-learn \
      opencv-python \
      numpy \
      pandas \
      matplotlib \
      jupyterlab \
      ipykernel

    touch "{{ dev_home }}/dev/ai-sandbox/.venv/.ai-packages-installed"
  args:
    executable: /bin/bash
    creates: "{{ dev_home }}/dev/ai-sandbox/.venv/.ai-packages-installed"


- name: Install AI Python system dependencies
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
      - python3-dev
      - build-essential
      - git
      - ffmpeg
      - libgl1
      - libglib2.0-0
    state: present
    update_cache: true

- name: Validate GPU is visible before installing GPU AI stack
  ansible.builtin.command: nvidia-smi
  register: ai_nvidia_smi
  changed_when: false
  failed_when: false

- name: Warn if NVIDIA GPU is not available
  ansible.builtin.debug:
    msg: "nvidia-smi failed. PyTorch GPU acceleration may not work."
  when: ai_nvidia_smi.rc != 0
