---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install minimal base packages
  ansible.builtin.apt:
    name:
      - git
      - curl
      - wget
      - vim
      - htop
      - unzip
      - ca-certificates
      - gnupg
      - lsb-release
      - build-essential
      - software-properties-common
    state: present