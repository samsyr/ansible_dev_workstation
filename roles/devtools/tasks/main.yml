# --- GitHub CLI ---
- name: Add GitHub CLI GPG key
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/trusted.gpg.d/githubcli-archive-keyring.gpg
    mode: "0644"

- name: Add GitHub CLI repository
  vars:
    gh_arch: "{{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}"
    gh_keyring: /etc/apt/trusted.gpg.d/githubcli-archive-keyring.gpg
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ gh_arch }} signed-by={{ gh_keyring }}] https://cli.github.com/packages stable main"
    state: present
    filename: github-cli

- name: Install GitHub CLI
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true

# --- lazygit ---
- name: Install lazygit (latest release)
  ansible.builtin.shell: |
    set -o pipefail
    LAZYGIT_VERSION=$(curl -s https://api.github.com/repos/jesseduffield/lazygit/releases/latest | grep -Po '"tag_name": "v\K[^"]*')
    curl -Lo /tmp/lazygit.tar.gz "https://github.com/jesseduffield/lazygit/releases/latest/download/lazygit_${LAZYGIT_VERSION}_Linux_x86_64.tar.gz"
    tar xf /tmp/lazygit.tar.gz -C /tmp
    install /tmp/lazygit /usr/local/bin
  args:
    creates: /usr/local/bin/lazygit
    executable: /bin/bash

# --- VS Code via snap ---
- name: Install VS Code
  community.general.snap:
    name: code
    classic: true

# --- VS Code AI assistants ---

- name: Install VS Code AI extensions (root workaround)
  ansible.builtin.shell: |
    set -eo pipefail
    if ! code --no-sandbox --user-data-dir /root/.vscode --list-extensions | grep -qi "^{{ item | lower }}$"; then
      code --no-sandbox --user-data-dir /root/.vscode --install-extension {{ item }} || true
    fi
  args:
    executable: /bin/bash
  loop:
    - GitHub.copilot
    - saoudrizwan.claude-dev
  failed_when: false
  changed_when: false

# --- Sublime Text ---
- name: Add Sublime GPG key
  ansible.builtin.get_url:
    url: https://download.sublimetext.com/sublimehq-pub.gpg
    dest: /etc/apt/trusted.gpg.d/sublime.asc
    mode: "0644"

- name: Add Sublime repository
  ansible.builtin.apt_repository:
    repo: "deb https://download.sublimetext.com/ apt/stable/"
    state: present
    filename: sublime

- name: Install Sublime Text
  ansible.builtin.apt:
    name: sublime-text
    state: present
    update_cache: true

- name: Ensure /opt directory exists
  ansible.builtin.file:
    path: /opt
    state: directory
    mode: '0755'

- name: Get Cursor download URL from API
  ansible.builtin.uri:
    url: "https://cursor.com/api/download?platform=linux-x64&releaseTrack=latest"
    method: GET
    return_content: true
  register: devtools_cursor_api

- name: Download Cursor AppImage
  ansible.builtin.get_url:
    url: "{{ (devtools_cursor_api.content | from_json).downloadUrl }}"
    dest: "{{ cursor_path }}"
    mode: '0755'
    force: false

- name: Symlink Cursor to /usr/local/bin
  ansible.builtin.file:
    src: "{{ cursor_path }}"
    dest: /usr/local/bin/cursor
    state: link

- name: Create Cursor desktop entry
  ansible.builtin.copy:
    dest: /usr/share/applications/cursor.desktop
    mode: '0644'
    content: |
      [Desktop Entry]
      Name=Cursor
      Exec={{ cursor_path }}
      Icon=utilities-terminal
      Type=Application
      Categories=Development;
