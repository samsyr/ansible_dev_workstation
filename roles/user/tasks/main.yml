---
- name: Create personal user directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0755"
  loop:
    - "{{ dev_home }}/dev"
    - "{{ dev_home }}/bin"
    - "{{ dev_home }}/tmp"
    - "{{ dev_home }}/.bashrc.d"
    - "{{ dev_home }}/.local/bin"
    - "{{ dev_home }}/.config"
    - "{{ dev_home }}/.config/tealdeer"

- name: Configure global git settings
  become: true
  become_user: "{{ dev_user }}"
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  loop:
    - { name: "user.name", value: "{{ git_user_name }}" }
    - { name: "user.email", value: "{{ git_user_email }}" }
    - { name: "init.defaultBranch", value: "main" }
    - { name: "pull.rebase", value: "false" }

- name: Create dev aliases file
  ansible.builtin.copy:
    dest: "{{ dev_home }}/.bashrc.d/dev-aliases.sh"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0644"
    content: |
      # Dev aliases
      alias ll='ls -alF'
      alias gs='git status'
      alias ga='git add'
      alias gc='git commit'
      alias gp='git push'
      alias cat='batcat'
      alias fd='fdfind'

- name: Ensure .bashrc loads .bashrc.d
  ansible.builtin.lineinfile:
    path: "{{ dev_home }}/.bashrc"
    line: 'for f in ~/.bashrc.d/*.sh; do [ -r "$f" ] && . "$f"; done'
    state: present
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0644"

- name: Install Starship prompt for user
  become: true
  become_user: "{{ dev_user }}"
  ansible.builtin.shell: |
    curl -sS https://starship.rs/install.sh | sh -s -- -y -b "{{ dev_home }}/.local/bin"
  args:
    creates: "{{ dev_home }}/.local/bin/starship"

- name: Create minimal Starship config
  ansible.builtin.copy:
    dest: "{{ dev_home }}/.config/starship.toml"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0644"
    content: |
      add_newline = false

      format = "$directory $git_branch $git_status $character"

      [directory]
      truncation_length = 3
      truncate_to_repo = true
      style = "bold blue"

      [git_branch]
      symbol = "🌱 "
      format = "[$symbol$branch]($style) "

      [git_status]
      format = "[$all_status$ahead_behind]($style) "

      [character]
      success_symbol = "[❯](bold green)"
      error_symbol = "[❯](bold red)"

- name: Enable Starship in bash
  ansible.builtin.copy:
    dest: "{{ dev_home }}/.bashrc.d/starship.sh"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0644"
    content: |
      # Starship prompt
      export PATH="$HOME/.local/bin:$PATH"

      if command -v starship >/dev/null 2>&1; then
        eval "$(starship init bash)"
      fi

- name: Create tealdeer config
  ansible.builtin.copy:
    dest: "{{ dev_home }}/.config/tealdeer/config.toml"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0644"
    content: |
      [updates]
      auto_update = true

- name: Download tealdeer cache if missing
  become: true
  become_user: "{{ dev_user }}"
  ansible.builtin.command:
    cmd: tldr --update
  args:
    creates: "{{ dev_home }}/.cache/tealdeer"