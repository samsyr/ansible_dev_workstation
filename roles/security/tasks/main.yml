---
# --- Bitwarden desktop ---

- name: Check if Bitwarden desktop is installed
  ansible.builtin.command:
    cmd: snap list bitwarden
  register: bitwarden_snap
  changed_when: false
  failed_when: false

- name: Install Bitwarden desktop via snap
  ansible.builtin.command:
    cmd: snap install bitwarden
  when: bitwarden_snap.rc != 0
  register: bitwarden_install
  failed_when: false
  changed_when: bitwarden_install.rc == 0

- name: Warn if Bitwarden install failed
  ansible.builtin.debug:
    msg: "Bitwarden snap install failed. Try manually later: sudo snap install bitwarden"
  when:
    - bitwarden_snap.rc != 0
    - bitwarden_install is defined
    - bitwarden_install.rc != 0