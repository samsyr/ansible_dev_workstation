---
- name: Configure my Ubuntu desktop
  hosts: localhost
  become: true

  vars:
    nvidia_cuda_manage_driver: true
    nvidia_cuda_validate: true
    nvidia_cuda_install_toolkit: true

    dev_user: "sampo"
    dev_home: "/home/{{ dev_user }}"

    git_user_name: "Sampo Yrjänäinen"
    git_user_email: "sampo.yrjanainen@gmail.com"

    python_version: "3.11.13"
    java_version: "21.0.11-tem"
    gradle_version: "9.5.0"
    groovy_version: "4.0.31"

    cursor_path: /opt/cursor.AppImage

  roles:
    - { role: base, tags: [base] }
    - { role: user, tags: [user] }
    - { role: docker, tags: [docker] }
    - { role: devtools, tags: [devtools] }
    - { role: extras, tags: [extras] }
    - { role: jvm, tags: [jvm] }
    - { role: python_ai, tags: [python_ai] }
    - { role: security, tags: [security] }
    - { role: node_web, tags: [node_web] }
    - { role: media, tags: [media] }
