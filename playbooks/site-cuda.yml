---
- name: Configure my Ubuntu desktop with NVIDIA / CUDA support
  hosts: localhost
  become: true

  vars:
    nvidia_cuda_manage_driver: true
    nvidia_cuda_validate: true
    nvidia_cuda_install_toolkit: true
    nvidia_cuda_driver_package: "nvidia-driver-595-open"

    dev_user: "sampo"
    dev_home: "/home/{{ dev_user }}"

    git_user_name: "Sampo Yrjänäinen"
    git_user_email: "sampo.yrjanainen@gmail.com"

    python_version: "3.11.13"
    java_version: "21.0.11-tem"
    gradle_version: "9.5.0"
    groovy_version: "4.0.31"

    cursor_path: /opt/cursor.AppImage

    wallpaper_src: tiger_and_humming_bird.jpg
    wallpaper_dest: /home/sampo/Pictures/tiger_and_humming_bird.jpg


  roles:
    - base
    - user
    - docker
    - devtools
    - extras
    - jvm
    - security
    - nvidia_cuda
    - python_ai
    - node_web
    - media

  post_tasks:
    - name: Run CUDA performance tests
      ansible.builtin.command:
        cmd: bash cuda-performance-tests/cuda-tests.sh
        chdir: "{{ playbook_dir }}/.."
      become: false
      register: cuda_test_output
      failed_when: false
      changed_when: false

    - name: Show CUDA test output
      ansible.builtin.debug:
        msg: "{{ cuda_test_output.stdout_lines }}"
